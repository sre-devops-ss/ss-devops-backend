AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Monitoring Backend for AWS Resources

Globals:
  Function:
    Timeout: 300
    MemorySize: 256
#    Runtime: python3.9
    Environment:
      Variables:
        CASSANDRA_HOST: !Ref CassandraHost
        CASSANDRA_PORT: !Ref CassandraPort
        CASSANDRA_USERNAME: !Ref CassandraUsername
        CASSANDRA_PASSWORD: !Ref CassandraPassword
        CASSANDRA_KEYSPACE: monitoring
        SNS_TOPIC_ARN: !Ref MonitoringSNSTopic

Parameters:
  CassandraHost:
    Type: String
    Default: "NONE"
    Description: Cassandra host address
  
  CassandraPort:
    Type: Number
    Description: Cassandra port number
    Default: 9042
  
  CassandraUsername:
    Type: String
    Default: "NONE"
    Description: Cassandra username
  
  CassandraPassword:
    Type: String
    Default: "NONE"
    Description: Cassandra password
    NoEcho: true

  Environment:
    Type: String
    Default: dev

Resources:
  
  EC2CreateMonitoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      FunctionName: Devops-ec2_monitoring_create
      Handler: ec2_create.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricAlarm
                - cloudwatch:DescribeAlarms
                - cloudwatch:GetMetricStatistics
                - ec2:DescribeInstances
                - ssm:SendCommand
                - ssm:GetParameter
                - sns:Publish
              Resource: "*"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /ec2/install
            Method: post
  
  EC2FetchMetricsMonitoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      FunctionName: Devops-ec2_monitoring_fetch_metrics
      Handler: ec2_create.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricAlarm
                - cloudwatch:DescribeAlarms
                - cloudwatch:GetMetricStatistics
                - ec2:DescribeInstances
                - ssm:SendCommand
                - ssm:GetParameter
                - sns:Publish
              Resource: "*"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /ec2/getMetrics
            Method: get
  
  EC2FetchAlarmMonitoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      FunctionName: Devops-ec2_monitoring_fetch_alarm
      Handler: ec2_create.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
              Resource: "*"
            - Effect: Allow
              Action:
                - cloudwatch:PutMetricAlarm
                - cloudwatch:DescribeAlarms
                - cloudwatch:GetMetricStatistics
                - ec2:DescribeInstances
                - ssm:SendCommand
                - ssm:GetParameter
                - sns:Publish
              Resource: "*"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /ec2/getAlarms
            Method: get

