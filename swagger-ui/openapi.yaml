openapi: 3.0.4
info:
  title: PolicyGuard Unified API
  description: |
    Unified API for EC2, Auth, ECS, S3, and RDS monitoring and management.
    
    - Cross-account AWS monitoring
    - CloudWatch metrics and alarms
    - User and group management (Cognito)
    - Cassandra DB integration
    
    [Supportsages DevOps](https://supportsages.com)
  termsOfService: https://supportsages.com/terms/
  contact:
    name: Supportsages DevOps Team
    email: devops@supportsages.com
    url: https://supportsages.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
externalDocs:
  description: Find out more about PolicyGuard
  url: https://supportsages.com/policyguard
servers:
  - url: https://awsmonitor.supportsages.com
    description: Production API Gateway
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
# Tags for grouping
# ---
tags:
  - name: ec2-api
    description: EC2 monitoring and metrics
  - name: auth-api
    description: User and group management (Cognito)
  - name: s3-api
    description: S3 monitoring and notifications
  - name: rds-api
    description: RDS monitoring and alarms
  - name: ecs-api
    description: ECS monitoring and alarms
  - name: iam-api
    description: IAM role creation

paths:
  # --- EC2 ---
  /api/ec2/install:
    post:
      tags:
        - ec2-api
      summary: Create EC2 or ECS Monitoring
      description: |
        Sets up monitoring for EC2 instances or ECS services by creating CloudWatch alarms and optionally installing agents.
      operationId: installMonitoring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  example: "123456789012"
                region:
                  type: string
                  example: "us-east-1"
                instance_ids:
                  type: string
                  example: ["i-1234567890abcdef0", "i-0987654321fedcba0"]
                config:
                  type: object
                  example:
                    cpu_threshold: 80
                    memory_threshold: 85
                    disk_threshold: 85
                    evaluation_periods: 2
                    period: 300
                    alarm_actions: ["arn:aws:sns:us-east-1:123456789012:alerts-topic"]
      responses:
        '200':
          description: Monitoring enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "EC2 monitoring enabled successfully"
                  instances:
                    type: string
                    example: ["i-1234567890abcdef0", "i-0987654321fedcba0"]

  /api/ecs/install:
    post:
      tags:
        - ecs-api
      summary: Create ECS Monitoring
      description: |
        Sets up monitoring for ECS services by creating CloudWatch alarms.
      operationId: installEcsMonitoring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  example: "123456789012"
                region:
                  type: string
                  example: "us-east-1"
                cluster_name:
                  type: string
                  example: "my-ecs-cluster"
                service_names:
                  type: array
                  items:
                    type: string
                  example: ["my-ecs-service"]
                config:
                  type: object
                  example:
                    cpu_threshold: 80
                    memory_threshold: 85
                    evaluation_periods: 2
                    period: 300
                    alarm_actions: ["arn:aws:sns:us-east-1:123456789012:alerts-topic"]
      responses:
        '200':
          description: ECS monitoring enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "ECS monitoring enabled successfully"
                  services:
                    type: array
                    items:
                      type: string
                    example: ["my-ecs-service"]

  /api/s3/notification:
    post:
      tags:
        - s3-api
      summary: Create S3 Event Notification
      description: |
        Sets up S3 bucket event notifications (e.g., for object creation/deletion).
      operationId: createS3Notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  example: "123456789012"
                region:
                  type: string
                  example: "us-east-1"
                bucket_name:
                  type: string
                  example: "my-bucket"
                events:
                  type: array
                  items:
                    type: string
                  example: ["s3:ObjectCreated:*", "s3:ObjectRemoved:*"]
                notification_config:
                  type: object
                  example:
                    lambda_function_arn: "arn:aws:lambda:us-east-1:123456789012:function:my-function"
                    sns_topic_arn: "arn:aws:sns:us-east-1:123456789012:my-topic"
      responses:
        '200':
          description: S3 notification created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "S3 notification created successfully"
                  bucket:
                    type: string
                    example: "my-bucket"


  /api/rds/list:
    get:
      tags:
        - rds-api
      summary: Fetch RDS Instances Information
      description: |
        Fetches RDS instance data including standalone or cluster-based instances with pagination support.
      operationId: getRdsInstances
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
          description: AWS Account ID
          example: "123456789012"
        - name: region
          in: query
          required: false
          schema:
            type: string
          description: AWS region (e.g., us-east-1). Defaults to the value of `REGION` environment variable.
          example: "us-east-1"
        - name: next_token
          in: query
          required: false
          schema:
            type: string
          description: Token for retrieving the next page of results.
      
      responses:
        '200':
          description: RDS instances fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  rds_data:
                    type: array
                    description: List of RDS instances or clusters
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: Type of RDS resource (standalone or cluster)
                          example: "cluster"
                        cluster_id:
                          type: string
                          description: RDS cluster identifier
                          example: "cluster-id-12345"
                        instances:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Instance identifier
                                example: "instance-id-12345"
                              role:
                                type: string
                                description: The role of the instance (e.g., primary, replica). If not applicable, the value is 'UNKNOWN'.
                                example: "Primary"
                  next_token:
                    type: string
                    description: Token for the next page of results, if available.
                    example: "abcdef12345=="
        '400':
          description: Bad Request - Missing required parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error type.
                    example: "Missing required parameters"
                  message:
                    type: string
                    description: Detailed error message.
                    example: "account_id and ROLE_NAME are required"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Description of the error
                    example: "Failed to assume cross-account role"

  /api/rds/create/alarm/cpu:
    post:
      tags:
        - rds-api
      summary: Create CPU Utilization Alarm for RDS Instance
      description: Creates a CloudWatch CPU utilization alarm for a specific RDS DB instance using cross-account access.
      operationId: createRdsCpuAlarm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - account_id
                - db_identifier
              properties:
                account_id:
                  type: string
                  example: "123456789012"
                region:
                  type: string
                  example: "us-east-1"
                role_name:
                  type: string
                  example: "CrossAccountMonitoringRole"
                db_identifier:
                  type: string
                  example: "my-rds-instance"
                external_id:
                  type: string
                  example: "external-access-id-abc"  # Optional
                alarm_actions:
                  type: array
                  items:
                    type: string
                    example: "arn:aws:sns:us-east-1:123456789012:rds-alerts-topic"
                cpu_threshold:
                  type: integer
                  example: 80
                evaluation_periods:
                  type: integer
                  example: 2
                period:
                  type: integer
                  example: 300
      responses:
        '200':
          description: Alarm created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Alarm created successfully"
                  alarm_name:
                    type: string
                    example: "my-rds-instance-CPUUtilization"
                  db_identifier:
                    type: string
                    example: "my-rds-instance"
                  account_id:
                    type: string
                    example: "123456789012"
                  region:
                    type: string
                    example: "us-east-1"
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing required fields"
                  message:
                    type: string
                    example: "account_id, role_name, and db_identifier are required"
        '500':
          description: Internal server error or failed cross-account role
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to assume cross-account role"

  /api/user/login:
    post:
      tags:
        - auth-api
      summary: User Login
      description: Authenticates a user and returns a JWT token.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "user@example.com"
                password:
                  type: string
                  example: "password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: "eyJraWQiOiJLT..."
                  refresh_token:
                    type: string
                    example: "eyJjdHkiOiJKV1Q..."
                  expires_in:
                    type: integer
                    example: 3600
        '401':
          description: Invalid credentials

  /api/user/create:
    post:
      tags:
        - auth-api
      summary: Create User
      description: Creates a new user in Cognito.
      operationId: createUser
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "user@example.com"
                password:
                  type: string
                  example: "password123"
                email:
                  type: string
                  example: "user@example.com"
                group:
                  type: string
                  example: "admin"
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User created successfully"
                  user_id:
                    type: string
                    example: "12345678-1234-1234-1234-123456789012"
        '400':
          description: Invalid input


  /api/user/group:
    post:
      tags:
        - auth-api
      summary: Create Group
      description: Creates a new user group in Cognito.
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                group_name:
                  type: string
                  example: "admin"
                description:
                  type: string
                  example: "Administrators group"
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Group created successfully"
                  group_name:
                    type: string
                    example: "admin"
        '400':
          description: Invalid input
  
  /api/sso/iam/create-role:
    post:
      tags:
        - iam-api
      summary: Create IAM Role
      description: |
        Creates an IAM role in a specified AWS account with a trust policy,
        optional managed policies, and an inline policy to allow STS assume-role access to specified remote roles.
      operationId: createIamRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  example: "123456789012"
                region:
                  type: string
                  example: "us-east-1"
                role_name:
                  type: string
                  example: "cross-account-role"
                trust_policy_document:
                  type: object
                  example:
                    Version: "2012-10-17"
                    Statement:
                      - Effect: "Allow"
                        Principal:
                          AWS: "arn:aws:iam::222222222222:root"
                        Action: "sts:AssumeRole"
                policies:
                  type: array
                  description: Optional list of managed policy ARNs to attach.
                  items:
                    type: string
                  example:
                    - "arn:aws:iam::aws:policy/ReadOnlyAccess"
                assume_remote_role_arns:
                  type: array
                  description: Optional list of role ARNs that this role should be able to assume via STS.
                  items:
                    type: string
                  example:
                    - "arn:aws:iam::333333333333:role/RemoteReadRole"
      responses:
        '200':
          description: IAM role successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "IAM role created"
                  role_arn:
                    type: string
                    example: "arn:aws:iam::123456789012:role/cross-account-role"
                  attached_policies:
                    type: array
                    items:
                      type: string
                    example:
                      - "arn:aws:iam::aws:policy/ReadOnlyAccess"
        '400':
          description: Missing or invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "account_id, role_name, and assume_role_policy_document are required"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "IAM error: AccessDenied"
  /api/sso/iam/list-users:
    post:
      tags:
        - iam-api
      summary: List IAM Users
      description: |
        Lists IAM users in the target AWS account using cross-account role assumption.
        Returns a paginated list of user details.
      operationId: listIamUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                  example: "123456789012"
                region:
                  type: string
                  example: "us-east-1"
                marker:
                  type: string
                  description: Optional marker for pagination (returned from previous response if `is_truncated` is true).
                  example: "XYZABC123TOKEN"
      responses:
        '200':
          description: List of IAM users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        UserName:
                          type: string
                          example: "johndoe"
                        UserId:
                          type: string
                          example: "AIDAEXAMPLEID"
                        Arn:
                          type: string
                          example: "arn:aws:iam::123456789012:user/johndoe"
                        CreateDate:
                          type: string
                          format: date-time
                          example: "2024-05-12T10:24:18.123Z"
                  is_truncated:
                    type: boolean
                    example: true
                  next_marker:
                    type: string
                    example: "XYZABC123TOKEN"
        '400':
          description: Missing or invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "account_id is required"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "IAM error: AccessDenied"
