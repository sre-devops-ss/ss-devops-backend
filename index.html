<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EC2 Discovery Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <div class="container mt-4">
    <h1>EC2 Instance Discovery Test</h1>
    <p>This page sends a hardcoded POST request to the EC2 discovery API.</p>

    <div class="card">
      <div class="card-header">
        <h5>Trigger API Call</h5>
      </div>
      <div class="card-body">
        <button class="btn btn-primary" onclick="testEC2Discovery()">Send Hardcoded POST</button>
        <div id="ec2TestResult" class="mt-3"></div>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-header">
        <h5>Console Log</h5>
      </div>
      <div class="card-body">
        <div id="consoleLog" style="height: 200px; overflow-y: auto; background-color: #f8f9fa; padding: 10px; font-family: monospace; font-size: 12px;"></div>
        <button class="btn btn-sm btn-outline-secondary mt-2" onclick="clearLog()">Clear Log</button>
      </div>
    </div>
  </div>

  <script>
    function log(message) {
      const logDiv = document.getElementById('consoleLog');
      const timestamp = new Date().toLocaleTimeString();
      logDiv.innerHTML += `[${timestamp}] ${message}\n`;
      logDiv.scrollTop = logDiv.scrollHeight;
      console.log(message);
    }

    function clearLog() {
      document.getElementById('consoleLog').innerHTML = '';
    }

    async function makeTestAPIRequest(data) {
      const url = 'https://awsmonitor.supportsages.com/api/ec2/listInstances';
      const options = {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Accept': 'application/json'
        },
        body: JSON.stringify(data)
      };

      try {
        log(`Request URL: ${url}`);
        log(`Payload: ${JSON.stringify(data, null, 2)}`);
        const response = await fetch(url, options);
        const contentType = response.headers.get('content-type');
        let result = contentType && contentType.includes('application/json')
          ? await response.json()
          : await response.text();

        log(`Response Status: ${response.status}`);
        log(`Response: ${typeof result === 'string' ? result : JSON.stringify(result, null, 2)}`);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        return result;
      } catch (error) {
        log(`Error: ${error.message}`);
        throw error;
      }
    }

    async function testEC2Discovery() {
      const resultDiv = document.getElementById('ec2TestResult');
      const hardcodedData = {
        account_id: '979453078508',
        region: 'ap-south-1'
      };

      try {
        resultDiv.innerHTML = '<div class="alert alert-info">Sending POST request...</div>';
        const result = await makeTestAPIRequest(hardcodedData);
        resultDiv.innerHTML = `
          <div class="alert alert-success">
            <strong>Success!</strong> EC2 discovery completed.
            <pre>${JSON.stringify(result, null, 2)}</pre>
          </div>
        `;
      } catch (error) {
        resultDiv.innerHTML = `
          <div class="alert alert-danger">
            <strong>Error!</strong> ${error.message}
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      log('EC2 Discovery Test Page Loaded');
    });
  </script>
</body>
</html>
