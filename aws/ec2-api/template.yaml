AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Monitoring Backend for AWS Resources

Parameters:
  CassandraHost:
    Type: String
    Default: "NONE"
    Description: Cassandra host address
  
  CassandraPort:
    Type: Number
    Description: Cassandra port number
    Default: 9042
  
  CassandraUsername:
    Type: String
    Default: "NONE"
    Description: Cassandra username
  
  CassandraPassword:
    Type: String
    Default: "NONE"
    Description: Cassandra password
    NoEcho: true

  Environment:
    Type: String
    Default: dev

Globals:
  Function:
    Runtime: python3.9
    Timeout: 300
    MemorySize: 256
    Environment:
      Variables:
        CASSANDRA_HOST: !Ref CassandraHost
        CASSANDRA_PORT: !Ref CassandraPort
        CASSANDRA_USER: !Ref CassandraUsername
        CASSANDRA_PASSWORD: !Ref CassandraPassword
        CASSANDRA_KEYSPACE: monitoring

Resources:

  # /ec2/install
  EC2CreateMonitoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../ec2-api
      FunctionName: Devops-ec2_monitoring_create
      Handler: ec2_monitoring_create.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - cloudwatch:*
                - ec2:DescribeInstances
                - ssm:*
                - sns:Publish
              Resource: "*"
      Events:
        InstallAPI:
          Type: Api
          Properties:
            Path: /ec2/install
            Method: post

