  # /ec2/getAlarms
  EC2FetchAlarmMonitoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../ec2-api
      FunctionName: Devops-ec2_monitoring_fetch_alarm
      Handler: ec2_monitoring_alarm_db_updator.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - cloudwatch:*
                - ec2:DescribeInstances
                - ssm:*
                - sns:Publish
              Resource: "*"
      Events:
        GetAlarmsAPI:
          Type: Api
          Properties:
            Path: /ec2/getAlarms
            Method: get

  # /ec2/updateMetricsToDb
  EC2UpdateMetricsDbFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../ec2-api
      FunctionName: Devops-ec2_update_metrics_db
      Handler: ec2_monitoring-metric-db-updator.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:*
                - sts:AssumeRole
                - ec2:DescribeInstances
              Resource: "*"
      Events:
        UpdateMetricsToDbAPI:
          Type: Api
          Properties:
            Path: /ec2/updateMetricsToDb
            Method: post

  # /ec2/updateAlarmToDb
  EC2UpdateAlarmsDbFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../ec2-api
      FunctionName: Devops-ec2_update_alarm_db
      Handler: ec2_monitoring_alarm_db_updator.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:*
                - sts:AssumeRole
                - ec2:DescribeInstances
              Resource: "*"
      Events:
        UpdateAlarmToDbAPI:
          Type: Api
          Properties:
            Path: /ec2/updateAlarmToDb
            Method: post
