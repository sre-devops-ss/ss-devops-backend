AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: NAT Gateway Monitoring Backend

Parameters:
  Environment:
    Type: String
    Default: dev
  CrossAccRoleName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: '/ss/backend/cross-account-role-name'
  CrossAccRoleArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: '/ss/backend/cross-account-role-arn'

Globals:
  Function:
    Runtime: python3.10
    Timeout: 300
    MemorySize: 256
    Environment:
      Variables:
        ROLE_NAME: !Ref CrossAccRoleName
        REGION: !Ref "AWS::Region"
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'*'"
      AllowOrigin: "'*'"
      AllowCredentials: "'*'"

Resources:
  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: "nat-api"
      StageName: !Ref Environment

  NATCreateMonitoringFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      FunctionName: Devops-nat_monitoring_create
      Handler: nat_monotoring_create.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - cloudwatch:*
                - ssm:GetParameter
              Resource: "*"
      Events:
        InstallAPI:
          Type: Api
          Properties:
            Path: /install
            Method: post
            RestApiId:
              Ref: ApiGatewayApi
      Environment:
        Variables:
          ROLE_NAME: !Ref CrossAccRoleName
          REGION: !Ref "AWS::Region"

  ApiGatewayId:
    Type: AWS::SSM::Parameter
    DependsOn: ApiGatewayApi
    Properties:
      Name: "/ss/backend/nat-monitoring-api/id"
      Type: String
      Value: { Ref: ApiGatewayApi }

Outputs:
  ApiGatewayApi:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  ApiGatewayApiId:
    Description: "API Gateway ID"
    Value: !Ref ApiGatewayApi 