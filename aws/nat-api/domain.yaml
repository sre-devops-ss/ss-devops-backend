AWSTemplateFormatVersion: "2010-09-09"
Description: Domain configuration for Generic Monitoring API Gateway

Parameters:
  ApiGatewayID:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/ss/backend/nat-monitoring-api/id"
  Environment:
    Type: String
    Default: dev

  Customdomain:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/devops-backend/api/custom_domain"

Resources:
  ApiPathMappingNat:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId:
        Ref: ApiGatewayID
      ApiMappingKey: "api/nat-monitoring-api"
      DomainName: !Ref Customdomain
      Stage: !Ref Environment 