AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FileprocessAPI deployment with Lambda to launch/shutdown Windows EC2

Parameters:
  WindowsAmiId:
    Type: String
    Default: "ami-0ed981b8451912647"

  Environment:
    Type: String
    Default: "dev"

Globals:
  Function:
    Runtime: python3.10
    Timeout: 60
    MemorySize: 256
  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'*'"
      AllowOrigin: "'*'"
      AllowCredentials: "'*'"

Resources:
  #################################
  # API Gateway
  #################################
  FileprocessApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: "fileprocess-api"
      StageName: !Ref Environment
      Auth:
        ApiKeyRequired: true

  #################################
  # IAM Role + Instance Profile for EC2
  #################################
  EC2S3Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "EC2S3Role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess   # adjust if you need write
      Path: "/"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "EC2InstanceProfile-${Environment}"
      Roles:
        - !Ref EC2S3Role

  #################################
  # Lambda: Create EC2 Instance
  #################################
  CreateInstanceLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "Fileprocess-Create-${Environment}"
      Description: Launch Windows EC2 instance for file processing
      Handler: process.lambda_handler
      CodeUri: ../fileprocess-api
      Environment:
        Variables:
          WINDOWS_AMI_ID: !Ref WindowsAmiId
          INSTANCE_PROFILE_ARN: !GetAtt EC2InstanceProfile.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ec2:RunInstances
                - ec2:DescribeInstances
              Resource: "*"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /create
            Method: post
            RestApiId: !Ref FileprocessApi
            Auth:
              ApiKeyRequired: true

  #################################
  # Lambda: Shutdown EC2 Instance
  #################################
  ShutdownInstanceLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "Fileprocess-Shutdown-${Environment}"
      Description: Shutdown Windows EC2 instance
      Handler: cleanup.lambda_handler
      CodeUri: ../fileprocess-api
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ec2:StopInstances
              Resource: "*"
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /shutdown/{id}
            Method: get
            RestApiId: !Ref FileprocessApi
            Auth:
              ApiKeyRequired: true

  #################################
  # Save API ID in SSM
  #################################
  ApiGatewayId:
    Type: AWS::SSM::Parameter
    DependsOn: FileprocessApi
    Properties:
      Name: "/fileprocess/api/id"
      Type: String
      Value: !Ref FileprocessApi


