AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS CloudFormation template for a Serverless application with Cognito authentication

Globals:
  Function:
    Runtime: python3.10
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,OPTIONS'"
      AllowHeaders: "'*'"
      AllowOrigin: "'*'"
      AllowCredentials: "'*'"
Resources:
  ServerlessDeploymentBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub "serverless-deployment-bucket-${AWS::AccountId}-${AWS::Region}"
      AccessControl: Private
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Name
          Value: ServerlessDeploymentBucket
        - Key: Environment
          Value: Production

  CognitoUserPool:
    Type: 'AWS::Cognito::UserPool'
    Properties:
      UserPoolName: dev0devops-backend-pool
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: false
          Required: true
        - Name: scope
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: '1'
            MaxLength: '256'
        - Name: org
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: '1'
            MaxLength: '256'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
        InviteMessageTemplate:
          SMSMessage: 'Your username is {username} and temporary password is {####}.'
          EmailMessage: 'Your username is {username} and temporary password is {####}.'
          EmailSubject: Your temporary password
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Priority: 1
            Name: verified_email
      UsernameConfiguration:
        CaseSensitive: false
      VerificationMessageTemplate:
        EmailMessageByLink: 'Please click the link below to complete your registration. {##Verify Email##}'
        EmailSubjectByLink: Your registration verification
        DefaultEmailOption: CONFIRM_WITH_LINK

  CognitoUserPoolClient:
    Type: 'AWS::Cognito::UserPoolClient'
    Properties:
      ClientName: devops-backend-client
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      AccessTokenValidity: 3600  # 1 hour
      IdTokenValidity: 3600     # 1 hour
      RefreshTokenValidity: 30  # 30 days
      TokenValidityUnits:
        AccessToken: seconds
        IdToken: seconds
        RefreshToken: days
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
  
  CognitoUserPoolClientForApiKey:
    Type: 'AWS::Cognito::UserPoolClient'
    Properties:
      ClientName: devops-backend-apikey-client
      UserPoolId: !Ref CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      AccessTokenValidity: 600  # 1 hour
      IdTokenValidity: 600     # 1 hour
      RefreshTokenValidity: 3600  # 30 days
      TokenValidityUnits:
        AccessToken: seconds
        IdToken: seconds
        RefreshToken: days
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED
  
  LambdaAuthorizerAccess:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../cognito
      Handler: lambda_authorizer-role.lambda_handler
      Runtime: python3.10
      MemorySize: 128
      FunctionName: Devops-lambdaAuthorizerAccess
      Description: "Lambda function to authorize access to the DevOps backend"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sts:AssumeRole
                - iam:ListUsers
                - cloudwatch:*
                - ssm:Describe*
                - ssm:Get*
                - ssm:List*
              Resource: "*"
      Environment:
        Variables:
          USER_POOL_ID: !Ref CognitoUserPool
          APP_CLIENT_ID: !Ref CognitoUserPoolClient
          REGION: !Ref "AWS::Region"
  LambdaInvokePermissionForAPIGateway:
  Type: AWS::Lambda::Permission
  Properties:
    FunctionName: !Ref LambdaAuthorizerAccess
    Action: lambda:InvokeFunction
    Principal: apigateway.amazonaws.com


  # SSM Parameters
  SsmUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/devops-backend/userpool-id"
      Type: String
      Value: !Ref CognitoUserPool
      Description: "Cognito User Pool ID for the DevOps backend"

  SsmUserPoolClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/devops-backend/userpool-client-id"
      Type: String
      Value: !Ref CognitoUserPoolClient
      Description: "Cognito User Pool Client ID for the DevOps backend"
  
  SsmUserPoolClientIdApiKey:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/devops-backend/userpool-apikey-client-id"
      Type: String
      Value: !Ref CognitoUserPoolClientForApiKey
      Description: "Cognito User Pool Client ID for temporary apikey generation for DevOps backend"
