AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon Keyspaces (Cassandra) Keyspace and Table

Resources:
  CassandraKeyspace:
    Type: AWS::Cassandra::Keyspace
    Properties:
      KeyspaceName: monitoring

  CassandraAlarmsTable:
    Type: AWS::Cassandra::Table
    Properties:
      KeyspaceName: !Ref CassandraKeyspace
      TableName: alarms
      PartitionKeyColumns:
        - Name: account_id
          Type: text
        - Name: resource_type
          Type: text
        - Name: resource_id
          Type: text
      ClusteringKeyColumns:
        - Name: alarm_name
          Type: text
        - Name: state_updated_timestamp
          Type: timestamp
      RegularColumns:
        - Name: metric_name
          Type: text
        - Name: threshold
          Type: double
        - Name: comparison_operator
          Type: text
        - Name: period
          Type: int
        - Name: state
          Type: text
        - Name: severity
          Type: text

  CassandraMetricsTable:
    Type: AWS::Cassandra::Table
    Properties:
      KeyspaceName: !Ref CassandraKeyspace
      TableName: metrics
      PartitionKeyColumns:
        - Name: account_id
          Type: text
        - Name: resource_id
          Type: text
      ClusteringKeyColumns:
        - Name: metric_name
          Type: text
        - Name: timestamp
          Type: timestamp
      RegularColumns:
        - Name: value
          Type: double
        - Name: unit
          Type: text

  CassandraAlarmHistoryTable:
    Type: AWS::Cassandra::Table
    Properties:
      KeyspaceName: !Ref CassandraKeyspace
      TableName: alarm_history
      PartitionKeyColumns:
        - Name: account_id
          Type: text
        - Name: resource_id
          Type: text
      ClusteringKeyColumns:
        - Name: alarm_name
          Type: text
        - Name: timestamp
          Type: timestamp
      RegularColumns:
        - Name: state
          Type: text
        - Name: severity
          Type: text
