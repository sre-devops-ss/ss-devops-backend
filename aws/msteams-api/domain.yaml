AWSTemplateFormatVersion: "2010-09-09"
Description: Create S3 Bucket.
Parameters:
  ApiGatewayID:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/devops-backend/msteamsapi/id"   #change
  Environment:
    Type: String
    Default: dev

  Customdomain:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/devops-backend/api/custom_domain"

Resources:
  ApiPathMappingUser:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId:
        Ref: ApiGatewayID
      ApiMappingKey: "api/msteams"
      DomainName: !Ref Customdomain
      Stage: !Ref Environment

