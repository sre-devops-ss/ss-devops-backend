AWSTemplateFormatVersion: '2010-09-09'
Description: Create ci/cd

Parameters:
  RepositoryName:
    Type: String
    AllowedValues:
      - 'RESOURCE-PIPELINE'
    Description: 'Stack Name will be used for naming'
  RepositoryBranchName:
    Type: String
  CustomCode:
    Type: String
    Default: 'NONE'
#  CODEBUILD PARAMS
  CodeBuildSourceType:
    Type: String
    Default: 'CODEPIPELINE'
    Description: 'Type of repository to use as source (e.g., CODEPIPELINE, GITHUB, S3).'
  CodeBuildSourceLocation:
    Type: String
    Default: ''
    Description: 'Location of the source code (e.g., repository URL, S3 bucket).'
  CodeBuildEnvironmentType:
    Type: String
    Default: 'LINUX_CONTAINER'
    Description: 'Type of build environment (e.g., LINUX_CONTAINER, WINDOWS_CONTAINER).'
  CodeBuildArtifactsType:
    Type: String
    Default: 'CODEPIPELINE'
  CodeBuildComputeType:
    Type: String
    Default: 'BUILD_GENERAL1_SMALL'
    AllowedValues:
      - 'BUILD_GENERAL1_SMALL'
      - 'BUILD_GENERAL1_MEDIUM'
      - 'BUILD_GENERAL1_LARGE'
    Description: 'Compute type for the build (e.g., BUILD_GENERAL1_SMALL).'
  CodeBuildImage:
    Type: String
    Description: 'standard series are ubuntu mostly'
    Default: 'aws/codebuild/amazonlinux2-x86_64-standard:4.0'
    AllowedValues:
      - 'aws/codebuild/amazonlinux2-x86_64-standard:5.0'
      - 'aws/codebuild/amazonlinux2-x86_64-standard:4.0'
      - 'aws/codebuild/amazonlinux2-aarch64-standard:3.0'
      - 'aws/codebuild/standard:7.0'
      - 'aws/codebuild/standard:6.0'
      - 'aws/codebuild/standard:5.0'
  CodeBuildBuildSpec:
    Type: AWS::SSM::Parameter::Value<String>
    Default: '/common/codebuild/base/buildspecCFNModule'
    AllowedValues:
      - '/common/codebuild/base/buildspecCFNModule'
      - '/common/codebuild/base/buildspecAutomation'
    Description: 'Inline commands for CodeBuild'

  CodeBuildServiceRole:
    Type: AWS::SSM::Parameter::Value<String>
    Default: '/common/role/codebuild/Arn'
    Description: 'access for CodeBuild'

#  PIPELINE
  PipeLineName:
    Type: String
  PipelineCrossAccountRoleArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: '/common/role/cross-acc/Arn'
  PipelineArtifactBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: '/common/bucket/pipeline-artifact'
  PipelineKmsId:
    Type: AWS::SSM::Parameter::Value<String>
    Default: '/common/kms/id'

  PipelineServiceRole:
    Type: AWS::SSM::Parameter::Value<String>
    Default: '/common/role/pipeline/Arn'

#Event
  EventServiceRole:
    Type: AWS::SSM::Parameter::Value<String>
    Default: '/common/role/event/Arn'

Resources:
  Project:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${PipeLineName}-Build'
      ServiceRole: !Ref CodeBuildServiceRole
      Source:
        Type: !Ref CodeBuildSourceType
        Location: !Ref CodeBuildSourceLocation
        BuildSpec: !Ref CodeBuildBuildSpec
      Environment:
        Type: !Ref CodeBuildEnvironmentType
        ComputeType: !Ref CodeBuildComputeType
        Image: !Ref CodeBuildImage
        PrivilegedMode: true
      Artifacts:
        Type: !Ref CodeBuildArtifactsType

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn:
      - Project
    Properties:
      Name: !Ref PipeLineName
      ArtifactStore:
        Type: 'S3'
        Location: !Ref PipelineArtifactBucket
        EncryptionKey:
          Id: !Ref PipelineKmsId
          Type: 'KMS'
      RoleArn: !Ref PipelineServiceRole
      Stages:
        - Name: "Source"
          Actions:
            - Name: "Source"
              ActionTypeId:
                Owner: 'AWS'
                Category: 'Source'
                Provider: 'CodeCommit'
                Version: '1'
              OutputArtifacts:
                - Name: 'SourceArtifact'
              Configuration:
                RepositoryName: !Ref RepositoryName
                BranchName: !Ref RepositoryBranchName
                OutputArtifactFormat: 'CODE_ZIP'
                PollForSourceChanges: 'false'
              RoleArn: !Ref PipelineCrossAccountRoleArn
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
              Configuration:
                ProjectName: !Sub '${PipeLineName}-Build'
              RunOrder: 1
